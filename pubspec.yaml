name: scan2
description: "Scan2 — an offline document scanner with live edge detection, auto-capture, perspective correction and scan filters."
publish_to: 'none'
version: 1.0.3+719

environment:
  sdk: '^3.12.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Storage
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Camera and imaging
  camera: ^0.11.0+1
  image_picker: ^1.1.2
  image: ^4.3.0
  cunning_document_scanner: ^1.2.3

  # Export and share
  pdf: ^3.11.1
  share_plus: ^10.0.2

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.2

flutter:
  uses-material-design: true
